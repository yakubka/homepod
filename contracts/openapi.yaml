                properties:
                  ok: { const: true }
                  data: { $ref: "./schemas/Settings.json" }
              examples:
                merged:
                  summary: After the brighter example
                  value: {"ok": true, "data": {"room_id": "b-204", "room_name": "Lecture Hall B-204", "timezone": "Asia/Tashkent",
                    "lighting": {"target_lux": 350, "vacancy_timeout_s": 300, "vacant_brightness": 20, "daylight_harvesting": true, "presets": {
                      "lecture": {"left": 80, "center": 80, "right": 80, "professor": 100},
                      "presentation": {"left": 30, "center": 10, "right": 30, "professor": 60}}},
                    "climate": {"default_target_c": 22.5, "hysteresis_c": 0.5},
                    "voice": {"enabled": true, "wake_word": "hey_room", "language": "en-US", "min_confidence": 0.6},
                    "announcements": {"volume": 70},
                    "updated_at": "2026-10-13T07:30:12.000Z"}}
        "400":
          description: Invalid body.
          content:
            application/json:
              schema: { $ref: "./schemas/ErrorResponse.json" }
              examples:
                timeoutTooShort:
                  summary: Vacancy timeout under 30 seconds
                  value: {"ok": false, "error": {"code": "invalid_input", "message": "lighting.vacancy_timeout_s must be between 30 and 3600.", "detail": {"field": "lighting.vacancy_timeout_s", "reason": "out_of_range"}}}
                readOnly:
                  summary: Read-only field
                  value: {"ok": false, "error": {"code": "invalid_input", "message": "room_id cannot be changed.", "detail": {"field": "room_id", "reason": "read_only"}}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Unexpected" }

  /history:
    get:
      tags: [history]
      operationId: getHistory
      summary: Metric history
      description: Bucketed means of one metric. The window may hold at most 1440 buckets. Data is kept for 30 days.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -H "X-Room-Key: $ROOM_KEY" "http://room-pi.local:8080/api/v1/history?metric=temperature_c&from=2026-10-13T09:00:00.000Z&to=2026-10-13T09:15:00.000Z&bucket_s=300"
      parameters:
        - name: metric
          in: query
          required: true
          description: Metric to return.
          schema: { $ref: "./schemas/HistorySeries.json#/$defs/HistoryMetric" }
          example: temperature_c
        - name: from
          in: query
          required: true
          description: Window start, ISO 8601 UTC, rounded down to the bucket.
          schema: { $ref: "./schemas/common.json#/$defs/Timestamp" }
          example: "2026-10-13T09:00:00.000Z"
        - name: to
          in: query
          required: true
          description: Window end, ISO 8601 UTC, rounded up to the bucket.
          schema: { $ref: "./schemas/common.json#/$defs/Timestamp" }
          example: "2026-10-13T09:15:00.000Z"
        - name: bucket_s
          in: query
          description: Bucket width in seconds, default 300.
          schema: { $ref: "./schemas/HistorySeries.json#/$defs/HistoryBucket" }
          example: 300
        - name: zone
          in: query
          description: Zone, only valid with metric occupancy. Omitted means the whole room.
          schema: { $ref: "./schemas/common.json#/$defs/Zone" }
          example: left
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                additionalProperties: false
                properties:
                  ok: { const: true }
                  data: { $ref: "./schemas/HistorySeries.json" }
              examples:
                temperature:
                  summary: Fifteen minutes of temperature
                  value: {"ok": true, "data": {"metric": "temperature_c", "unit": "celsius", "zone": null, "from": "2026-10-13T09:00:00.000Z", "to": "2026-10-13T09:15:00.000Z", "bucket_s": 300, "points": [
                    {"ts": "2026-10-13T09:00:00.000Z", "value": 23.1},
                    {"ts": "2026-10-13T09:05:00.000Z", "value": 23.6},
                    {"ts": "2026-10-13T09:10:00.000Z", "value": null}]}}
        "400":
          description: Invalid query.
          content:
            application/json:
              schema: { $ref: "./schemas/ErrorResponse.json" }
              examples:
                tooManyPoints:
                  summary: Window too long for the bucket
                  value: {"ok": false, "error": {"code": "invalid_input", "message": "The window holds 4320 buckets, at most 1440 are allowed.", "detail": {"field": "to", "reason": "too_many_points"}}}
                zoneWithoutOccupancy:
                  summary: zone with a room metric
                  value: {"ok": false, "error": {"code": "invalid_input", "message": "zone is only valid with metric occupancy.", "detail": {"field": "zone", "reason": "not_allowed"}}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: The recorder is down.
          content:
            application/json:
              schema: { $ref: "./schemas/ErrorResponse.json" }
              examples:
                recorderDown:
                  summary: History store unavailable
                  value: {"ok": false, "error": {"code": "degraded", "message": "History is unavailable, the recorder is down.", "detail": {"components": [{"name": "recorder", "status": "down"}]}}}
        default: { $ref: "#/components/responses/Unexpected" }

  /voice/ask:
    post:
      tags: [voice]
      operationId: askVoice
      summary: Ask in text
      description: Runs the text through the same parser and engine path as a spoken request. Answers after the decision and, for device actions, after every acknowledgement.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -s -X POST -H "X-Room-Key: $ROOM_KEY" -H "Content-Type: application/json" \
              -d '{"text":"what is the temperature in here"}' http://room-pi.local:8080/api/v1/voice/ask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/VoiceAskRequest.json" }
            examples:
              question:
                summary: Temperature question
                value: {"text": "what is the temperature in here"}
              command:
                summary: Lighting command with a client id
                value: {"text": "set the left lights to forty percent", "request_id": "req_8d1f6g3h2j"}
      responses:
        "200":
          description: Understood and handled, or not understood.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                additionalProperties: false
                properties:
                  ok: { const: true }
                  data: { $ref: "./schemas/VoiceAskResponse.json" }
              examples:
                answered:
                  summary: Query answered
                  value: {"ok": true, "data": {"request_id": "req_5t2w9x1c7v", "command": {"request_id": "req_5t2w9x1c7v", "intent": "query_temperature", "action": "query", "target": {"type": "climate", "zone": null}, "params": {}, "confidence": 0.97, "raw_text": "what is the temperature in here", "source": "app"}, "outcome": "answered", "reply_text": "It is 23.4 degrees in the room.", "decision_id": "dec_01h9x7q8zt"}}
                executed:
                  summary: Lights changed
                  value: {"ok": true, "data": {"request_id": "req_8d1f6g3h2j", "command": {"request_id": "req_8d1f6g3h2j", "intent": "set_brightness", "action": "set", "target": {"type": "lighting", "zone": "left"}, "params": {"brightness": 40}, "confidence": 0.95, "raw_text": "set the left lights to forty percent", "source": "app"}, "outcome": "executed", "reply_text": "Left lights set to 40 percent.", "decision_id": "dec_01h9xc6v2n"}}
                notUnderstood:
                  summary: Unknown intent
                  value: {"ok": true, "data": {"request_id": "req_2a9s8d7f6g", "command": {"request_id": "req_2a9s8d7f6g", "intent": "unknown", "action": "none", "target": {"type": "none", "zone": null}, "params": {}, "confidence": 0.31, "raw_text": "open the window", "source": "app"}, "outcome": "not_understood", "reply_text": "Sorry, I can't help with that yet.", "decision_id": null}}
        "400":
          description: Invalid body.
          content:
            application/json:
              schema: { $ref: "./schemas/ErrorResponse.json" }
              examples:
                empty:
                  summary: Empty text
                  value: {"ok": false, "error": {"code": "invalid_input", "message": "text must be 1 to 200 characters.", "detail": {"field": "text", "reason": "length"}}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: The voice parser is not running.
          content:
            application/json:
              schema: { $ref: "./schemas/ErrorResponse.json" }
              examples:
                parserDown:
                  summary: Voice stack down
                  value: {"ok": false, "error": {"code": "degraded", "message": "Requests cannot be understood right now, the voice stack is down.", "detail": {"components": [{"name": "voice", "status": "down"}]}}}
        "504": { $ref: "#/components/responses/DeviceTimeout" }
        default: { $ref: "#/components/responses/Unexpected" }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live event stream
      description: |
        Server-Sent Events. Every event has `id` equal to the envelope id, `event` equal to the topic and
        `data` equal to one BusEnvelope as compact JSON on a single line. The latest system.state is sent
        immediately after connecting. A comment line `: keepalive` is sent every 15 seconds. There is no
        replay, a client that reconnects calls GET /state to resynchronise.
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -N -H "X-Room-Key: $ROOM_KEY" -H "Accept: text/event-stream" "http://room-pi.local:8080/api/v1/events?topics=system.state,decision.action"
      parameters:
        - name: topics
          in: query
          description: Comma separated topics to receive, default system.state and decision.action.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: "./schemas/common.json#/$defs/BusTopic" }
          example: [system.state, decision.action, perception.occupancy]
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream, each data line is a BusEnvelope.
              examples:
                twoEvents:
                  summary: An occupancy event and the decision it caused
                  value: |
                    id: evt_9k2j4h1m0p
                    event: perception.occupancy
                    data: {"id":"evt_9k2j4h1m0p","topic":"perception.occupancy","ts":"2026-10-13T08:55:02.180Z","source":"vision","contract_version":"1.0.0","correlation_id":null,"payload":{"ts":"2026-10-13T08:55:02.140Z","total":1,"occupied":true,"zones":[{"zone":"left","count":1,"occupied":true,"confidence":0.9},{"zone":"center","count":0,"occupied":false,"confidence":0.95},{"zone":"right","count":0,"occupied":false,"confidence":0.96},{"zone":"professor","count":0,"occupied":false,"confidence":0.97}],"source":"vision","confidence":0.9,"stale":false,"frame_id":18342}}

                    id: evt_3c6v9b2n5m
                    event: decision.action
                    data: {"id":"evt_3c6v9b2n5m","topic":"decision.action","ts":"2026-10-13T08:55:02.210Z","source":"engine","contract_version":"1.0.0","correlation_id":"dec_01h9x4k2pq","payload":{"id":"dec_01h9x4k2pq","ts":"2026-10-13T08:55:02.205Z","trigger":{"type":"occupancy","topic":"perception.occupancy","event_id":"evt_9k2j4h1m0p"},"rule":"occupancy_lights_on","action":{"type":"lighting.set_zone","zone":"left","params":{"brightness":80,"fade_ms":400}},"outcome":"issued","summary":"Left zone became occupied and ambient light is 140 lux, below the 300 lux target.","commands":[{"cmd_id":"c00a41f2e","type":"set_zone_light","status":"pending"}],"request_id":null,"reply_text":null}}

                    : keepalive
        "400":
          description: Unknown topic.
          content:
            application/json:
              schema: { $ref: "./schemas/ErrorResponse.json" }
              examples:
                unknownTopic:
                  summary: Topic not in the enum
                  value: {"ok": false, "error": {"code": "invalid_input", "message": "topics contains an unknown topic sensor.noise.", "detail": {"field": "topics", "reason": "invalid_enum"}}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Unexpected" }

components:
  securitySchemes:
    roomKey:
      type: apiKey
      in: header
      name: X-Room-Key
      description: Shared room key, set when the Pi is provisioned and entered once in the app. Required on every call except GET /health.

  parameters:
    LectureId:
      name: id
      in: path
      required: true
      description: Lecture id.
      schema: { $ref: "./schemas/common.json#/$defs/LectureId" }
      example: lec_7f3k2m9q1x

  responses:
    Unauthorized:
      description: Missing or wrong X-Room-Key.
      content:
        application/json:
          schema: { $ref: "./schemas/ErrorResponse.json" }
          examples:
            missingKey:
              summary: Header absent
              value: {"ok": false, "error": {"code": "unauthorized", "message": "X-Room-Key header is missing or wrong.", "detail": {}}}
    LectureNotFound:
      description: Unknown lecture.
      content:
        application/json:
          schema: { $ref: "./schemas/ErrorResponse.json" }
          examples:
            unknownLecture:
              summary: No such id
              value: {"ok": false, "error": {"code": "not_found", "message": "Lecture lec_0000000000 was not found.", "detail": {"resource": "lecture", "id": "lec_0000000000"}}}
    DeviceUnavailable:
      description: The ESP32 link is down or the device rejected the command.
      content:
        application/json:
          schema: { $ref: "./schemas/ErrorResponse.json" }
          examples:
            linkDown:
              summary: No frame from the ESP32 for 15 seconds
              value: {"ok": false, "error": {"code": "device_unavailable", "message": "The room controller is offline.", "detail": {"device": "esp32-a1b2c3", "reason": "link_down", "last_seen_at": "2026-10-13T09:01:12.400Z"}}}
            rejected:
              summary: Device refused the command
              value: {"ok": false, "error": {"code": "device_unavailable", "message": "The room controller rejected the command.", "detail": {"device": "esp32-a1b2c3", "reason": "hardware_fault", "cmd_id": "c00a41f30"}}}
    DeviceTimeout:
      description: The ESP32 did not acknowledge after 3 attempts. The state returned by a later GET shows confirmed false.
      content:
        application/json:
          schema: { $ref: "./schemas/ErrorResponse.json" }
          examples:
            noAck:
              summary: Three attempts without ack
              value: {"ok": false, "error": {"code": "device_timeout", "message": "The room controller did not acknowledge the command.", "detail": {"device": "esp32-a1b2c3", "cmd_id": "c00a41f2e", "attempts": 3}}}
    Unexpected:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "./schemas/ErrorResponse.json" }
          examples:
            internal:
              summary: Unhandled exception
              value: {"ok": false, "error": {"code": "internal", "message": "Unexpected server error.", "detail": {}}}

  examples:
    LectureScheduled:
      summary: Scheduled lecture
      value: {"ok": true, "data": {"id": "lec_7f3k2m9q1x", "title": "Distributed Systems, week 7", "course_code": "CS301", "lecturer": "Dr. Karimova", "starts_at": "2026-10-13T09:00:00.000Z", "ends_at": "2026-10-13T10:30:00.000Z", "status": "scheduled", "lighting_mode": "presentation", "notes": "Guest talk in the second half.", "created_at": "2026-10-10T14:02:11.000Z", "updated_at": "2026-10-10T14:02:11.000Z"}}
