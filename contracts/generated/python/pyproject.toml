[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-contracts"
version = "1.0.1"
description = "Generated models for the room controller interface contract."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3"]

[tool.setuptools]
packages = ["room_contracts"]

[tool.setuptools.package-data]
room_contracts = ["py.typed"]
